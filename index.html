<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FAST CPR Writing</title>

  <style>
    :root{
      --bg:#ffffff;
      --text:#111;
      --muted:#666;
      --border:#e6e6e6;
      --soft:#fafafa;
      --accent:#0b5fff;
      --radius:14px;
      --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial;
    }

    *{ box-sizing:border-box }

    body{
      margin:0;
      font-family:var(--sans);
      background:var(--bg);
      color:var(--text);
      padding:20px 14px 40px;
    }

    .container{
      max-width:720px;
      margin:0 auto;
    }

    h1{
      font-size:20px;
      margin:0 0 6px;
    }

    .sub{
      font-size:13px;
      color:var(--muted);
      margin-bottom:18px;
    }

    .card{
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px;
      background:#fff;
    }

    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin:14px 0 6px;
    }

    textarea{
      width:100%;
      min-height:80px;
      resize:vertical;
      padding:10px;
      border:1px solid var(--border);
      border-radius:12px;
      font-family:var(--sans);
      font-size:14px;
      line-height:1.4;
    }

    textarea:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(11,95,255,.12);
    }

    .tools{
      display:flex;
      justify-content:flex-end;
      margin-top:6px;
    }

    button{
      background:var(--soft);
      border:1px solid var(--border);
      border-radius:10px;
      padding:6px 10px;
      font-size:12px;
      cursor:pointer;
    }

    button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    button:hover{
      background:#f0f0f0;
    }

    footer{
      margin-top:18px;
      font-size:12px;
      color:var(--muted);
      text-align:center;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>FAST CPR Writing</h1>
  <div class="sub">
    Bu sayfa yalnızca CPR yazımı içindir.  
    Herhangi bir değerlendirme, stil veya kural uygulanmaz.
  </div>

  <div class="card">

    <label>Claim (Problem / Etki)</label>
    <textarea id="claim" placeholder="Problemi veya etkiyi yazın..."></textarea>
    <div class="tools">
      <button onclick="clearField('claim')">Temizle</button>
    </div>

    <label>Proposition — Özellik</label>
    <textarea id="feature" placeholder="Ürün özelliğini yazın..."></textarea>
    <div class="tools">
      <button onclick="clearField('feature')">Temizle</button>
    </div>

    <label>Proposition — Avantaj</label>
    <textarea id="advantage" placeholder="Bu özelliğin sağladığı avantajı yazın..."></textarea>
    <div class="tools">
      <button onclick="clearField('advantage')">Temizle</button>
    </div>

    <label>Proposition — Fayda</label>
    <textarea id="benefit" placeholder="Hekim / hasta açısından faydayı yazın..."></textarea>
    <div class="tools">
      <button onclick="clearField('benefit')">Temizle</button>
    </div>

    <label>Recommendation (Kapanış)</label>
    <textarea id="recommendation" placeholder="Kapanış / aksiyon cümlesini yazın..."></textarea>
    <div class="tools">
      <button onclick="clearField('recommendation')">Temizle</button>
    </div>

    <label>Birleştirilmiş CPR</label>
    <textarea id="mergedCpr" placeholder="Tüm alanları doldurduktan sonra &quot;Birleştir&quot; ile otomatik oluşur..." readonly></textarea>
    <div class="tools">
      <button id="mergeBtn" onclick="mergeCPR()" disabled>Birleştir</button>
      <button onclick="clearField('mergedCpr')">Temizle</button>
    </div>


  </div>

  <footer>
    FAST CPR Writing — düşün, yaz, üret.
  </footer>
</div>

<script>
  const FIELDS = ["claim","feature","advantage","benefit","recommendation"];

  function $(id){ return document.getElementById(id); }

  function clearField(id){
    const el = $(id);
    el.value = "";
    el.focus();
    updateMergeState();
  }

  function normalizeText(s){
    return (s || "").trim().replace(/\s+/g," ");
  }

  function ensureEndPunctuation(s){
    if(!s) return "";
    return /[.!?…]$/.test(s) ? s : (s + ".");
  }

  function ensureQuestion(s){
    if(!s) return "";
    return /\?$/.test(s) ? s : (s + "?");
  }

  function pickByHash(seed, arr){
    const h = Array.from(seed).reduce((acc,ch)=> (acc*31 + ch.charCodeAt(0)) >>> 0, 0);
    return arr[h % arr.length];
  }

  function allFilled(){
    return FIELDS.every(id => normalizeText($(id).value).length > 0);
  }

  function updateMergeState(){
    const btn = $("mergeBtn");
    if(!btn) return;
    btn.disabled = !allFilled();
  }

  function mergeCPR(){
    if(!allFilled()){
      updateMergeState();
      return;
    }

    const claim = normalizeText($("claim").value);
    const feature = normalizeText($("feature").value);
    const advantage = normalizeText($("advantage").value);
    const benefit = normalizeText($("benefit").value);
    const rec = normalizeText($("recommendation").value);

    const c = ensureEndPunctuation(claim);

    // Bağlaç havuzu (deterministik seçim: aynı içerik -> aynı bağlaç)
    const connAdv = ["Bu sayede", "Bu nedenle", "Bu yüzden", "Bu özelliği sayesinde", "Bunun sonucu olarak"];
    const connBen = ["Böylece", "Sonuç olarak", "Bu sayede", "Bu nedenle", "Bu yüzden"];

    const seed = claim + "||" + feature + "||" + advantage + "||" + benefit;

    const cAdv = pickByHash(seed + "|adv", connAdv);
    const cBen = pickByHash(seed + "|ben", connBen);

    function startsWithConnector(s){
      return /^(Bu nedenle|Bu sayede|Bu yüzden|Böylece|Sonuç olarak|Bu özelliği sayesinde|Bunun sonucu olarak)\b/i.test(s || "");
    }

    function stripTrailingPunct(s){
      return (s || "").trim().replace(/[\s\.,;:!?]+$/g, "").trim();
    }

    // Proposition: Özellik + Avantaj + Fayda'yı okunur bir paragraf hâline getir
    let pText = "";
    const f = stripTrailingPunct(feature);
    const a = stripTrailingPunct(advantage);
    const b = stripTrailingPunct(benefit);

    if(f && a && b){
      const advPart = startsWithConnector(advantage) ? advantage.trim() : `${cAdv} ${a}`;
      const benPart = startsWithConnector(benefit) ? benefit.trim() : `${cBen} ${b}`;
      // 2 cümlelik daha akıcı bir yapı
      pText = `${f}. ${advPart}. ${benPart}`;
    } else {
      // Eksik alanlarda: eldeki parçaları birleştir, tek bağlaçla destekle
      let prop = [feature, advantage, benefit].filter(Boolean).join(" ");
      prop = normalizeText(prop);

      const connectors = ["Bu nedenle", "Bu sayede", "Bu yüzden"];
      const connector = pickByHash(seed, connectors);

      const propWithConnector = startsWithConnector(prop) ? prop : (connector + " " + prop);
      pText = propWithConnector;
    }

    const p = ensureEndPunctuation(pText);

    // Recommendation: soru işaretiyle bitir ve gerekirse nazik kapanış kalıbı ekle
    let rText = rec;
    if(rec && !/\?/g.test(rec) && !/\bmisiniz\b/i.test(rec) && !/\bmısınız\b/i.test(rec)){
      // "önerir misiniz?" gibi bir kapanış yoksa, yumuşak bir kalıp ekleyelim
      rText = rec.replace(/[\s\.,;:!?]+$/g,"").trim();
    }
    const r = ensureQuestion(rText);

    const full = `${c} ${p} ${r}`.replace(/\s+/g," ").trim();
    $("mergedCpr").value = full;
    $("mergedCpr").focus();
    $("mergedCpr").setSelectionRange(0,0);
  }

  // Birleştir butonu sadece tüm alanlar doluyken aktif olsun
  window.addEventListener("DOMContentLoaded", () => {
    FIELDS.forEach(id => {
      const el = $(id);
      if(el) el.addEventListener("input", updateMergeState);
    });
    updateMergeState();
  });
</script>

</body>
</html>
